<!DOCTYPE html>
<html>

<head>
    <link href="banco.css" rel="stylesheet" />
    <script src="cuentas.js"></script>
    <script src="utilitarios.js"></script>
</head>

<body onload="cargar();">
    <div class="principal">
        <div class="menu">
            <div class="contenedorLogo">
                <img src="./imagenes/logoKrakeDev.png" width="80%" />
            </div>
            <div class="contenedorBotones">
                <input type="button" value="CUENTAS" class="boton" onclick="cargar();"/>
                <input type="button" value="TRANSACCIONES" class="boton" onclick="transaccion();"/>
                <input type="button" value="MOVIMIENTOS" class="boton" onclick="movimientoss();"/>
            </div>
            <div class="contenedorInfoGrupo">
                <div>ERIK TOAPANTA</div>
            </div>
        </div>
        <div class="contenido" id="divCuentas">
            <div class="superior">
                <div class="titulo">CUENTAS</div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto">Cedula</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtCedula"/>
                    </div>
                </div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto">Nombre</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtNombre"/>
                    </div>
                </div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto">Apellido</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtApellido"/>
                    </div>
                </div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto"># Cuenta</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtCuenta"/>
                    </div>
                </div>
                <div class="contenedorAcciones">
                    <input type="button" value="GUARDAR" onclick="agregar();"/>
                </div>
            </div>

            <div class="inferior" id="lblTabla">
            </div>

        </div>
        <div class="contenido" id="divTransacciones">
            <div class="superior">
                <div class="titulo">TRANSACCIONES</div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto"># Cuenta</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtTCuenta"/>
                    </div>
                    <div id="lblResultado">
                </div>
                </div>
                <div class="contenedorAcciones">
                    <input type="button" value="BUSCAR" onclick="ejecutarBusqueda();"/>
                </div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto">Cantidad</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtCantidad"/>
                    </div>
                    <div id="lblSaldo">
                </div>
                </div>
                <div class="contenedorAcciones">
                    <input type="button" value="DEPOSITAR" onclick="ejecutarDeposito();"/>
                    <input type="button" value="RETIRAR" onclick="ejecutarRetiro();"/>
                </div>
            </div>
        </div>
        <div class="contenido" id="divMovimientos">
            <div class="inferior">
                <div class="titulo">MOVIMIENTOS</div>
                <div class="contenedorTexto">
                    <div class="etiquetaTexto"># Cuenta</div>
                    <div class="cajaTexto">
                        <input type="text" class="caja" id="txtMCuenta"/>
                    </div>
                </div>
                <div class="contenedorAcciones">
                    <input type="button" value="BUSCAR" onclick="ejecutarMovimientos();"/>                    
                </div>
                <div id="tablaMovimientos">
                </div>
            </div>

        </div>
    </div>
</body>

</html>
